[project]
name = "lgpd-face-redactor"
version = "0.1.0"
description = "Blur every face in a video except the data subject's, for LGPD/GDPR access requests. Runs locally, fails safe, logs every decision."
readme = "README.md"
license = "MIT"
authors = [{ name = "Guilherme Fialho" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]

[project.scripts]
lgpd-redact = "lgpd_face_redactor.cli:main"
lgpd-redact-web = "lgpd_face_redactor.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lgpd_face_redactor"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12", "httpx>=0.27"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["models: downloads the real YuNet/SFace weights (run in CI)"]
